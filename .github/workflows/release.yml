name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build release APK
        env:
          SEEFI_KEYSTORE_BASE64: ${{ secrets.SEEFI_KEYSTORE_BASE64 }}
          SEEFI_KEYSTORE_PASSWORD: ${{ secrets.SEEFI_KEYSTORE_PASSWORD }}
          SEEFI_KEY_ALIAS: ${{ secrets.SEEFI_KEY_ALIAS }}
          SEEFI_KEY_PASSWORD: ${{ secrets.SEEFI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testReleaseUnitTest

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Attaching $APK to ${{ needs.release-please.outputs.tag_name }}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
